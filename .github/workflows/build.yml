name: Build Minecraft Forge 1.16.5 Mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Find Gradle wrapper
        id: find-gradle
        shell: bash
        run: |
          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE" -type f -name gradlew -not -path '*/.git/*' -print -quit)"
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew was not found in the repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle wrapper in: $PROJECT_DIR"

      - name: Grant execute permission to Gradle wrapper
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Build mod
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: ./gradlew --no-daemon build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaVisual-Forge-1.16.5
          path: ${{ steps.find-gradle.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
