name: Build Minecraft Forge 1.16.5 Mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-forge-1.16.5-mod
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
